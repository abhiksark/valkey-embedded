name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint, types, docs, manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install ruff check-manifest mypy types-psutil interrogate valkey psutil pytest
      - run: ruff check src/ tests/ examples/ tools/
      - run: ruff format --check src/ tests/ examples/ tools/
      - run: check-manifest
      - run: mypy --strict src/valkey_embedded
      - run: interrogate -c pyproject.toml src/valkey_embedded

  test:
    name: test py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      # The compiled binary is reused across runs: build_valkey.py skips the
      # compile when the cached binary's recorded version matches. Hashing the
      # build script in the key invalidates the cache on any version bump.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src/valkey_embedded/bin
            src/valkey_embedded/package_metadata.json
          key: valkey-bin-${{ runner.os }}-${{ hashFiles('tools/build_valkey.py') }}
      - name: Install C toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y make gcc
      # `pip install .` compiles the embedded Valkey via build_py (or reuses
      # the cache), so this also exercises the source-build path sdist users
      # hit. Running pytest against the installed package guards the pytest11
      # entry-point / conftest double-registration regression.
      - name: Install (compiles embedded Valkey)
        run: pip install .[dev]
      - name: Run fast test suite (with branch coverage gate)
        run: |
          coverage run -m pytest -m "not slow"
          coverage report
        # Codecov upload can be added once the repository is public.

  packaging:
    name: packaging tests (sdist + clean-venv install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y make gcc
      - run: pip install build pytest
      # Seed both setuptools build-lib layouts to prove that a renamed package
      # cannot leak from a developer's previous build into the wheel.
      - name: Seed stale build output
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from sysconfig import get_platform

          for build_lib in (
              Path("build/lib"),
              Path("build/lib.{0}-{1}".format(get_platform(), sys.implementation.cache_tag)),
          ):
              stale = build_lib / "valkeylite" / "contaminated.py"
              stale.parent.mkdir(parents=True, exist_ok=True)
              stale.write_text("stale\n")
          PY
      # Build a wheel so the offline inspection and clean-consumer tests have
      # an artifact. The standalone checker examines every produced wheel.
      - name: Build and validate wheel
        run: |
          pip wheel . --no-deps -w dist
          python tools/check_wheel.py dist/*.whl
      - run: pip install .[dev]
      - run: pytest -m "slow or packaging" tests/test_packaging.py
